name: Sinkron data HSP

# Mengambil HSP + koefisien + harga acuan terbaru dari Bangun Jakarta, lalu meng-commit
# public/data/hsp.json. Vercel otomatis deploy ulang setiap ada commit baru ke branch utama.
on:
  schedule:
    - cron: "0 20 * * 0"        # tiap Senin 03:00 WIB (Minggu 20:00 UTC)
  workflow_dispatch:             # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: sync-hsp
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Pasang dependensi
        run: |
          pip install -r tools/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ambil data HSP
        run: python tools/sync_hsp.py --debug

      - name: Simpan bukti debug jika gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-sync-hsp
          path: debug/
          if-no-files-found: ignore

      - name: Commit jika data berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/hsp.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "chore: perbarui data HSP $(date -u +%F)"
            git push
          fi
